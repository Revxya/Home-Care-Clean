<body>

    <div id="landingPageImage">
        <img src="./images/top-background-contact.jpg" alt="">
    </div>

    <nav>
        <div id="navItems">
            <img class="mainHeader" id="logo-image" src="./images/TransparentLogoTest.png">
            <a class="mainHeader underline" href="index.html"><span>About</span></a>
            <a class="mainHeader underline" href="previousWork.html"><span>Previous Work</span></a>

            <img id="menu-image" src="./images/Menu.png" alt="">
        </div>
    </nav>

    <section class="section">
    <div id="Contact-Content">
        <div id="Inner-Content-Left">
            <h1>Get in Touch</h1>
            <h2>We'd like to hear from you!</h2>
            <p>If you have any questions or just want to say hi, please use the
                contact form.
            </p>
        </div>

        <div id="Inner-Content-Right">
            <form id="contactForm">
            <div id="customer-name">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input id="firstName" type="text">
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input id="lastName" type="text">
                </div>
            </div>

            <div id="customer-email">
                <div class="form-group">
                    <label for="customerEmail">Email *</label>
                    <input id="customerEmail" type="text">
                </div>
            </div>

            <div id="customer-message">
                <div class="form-group">
                    <label for="customerMessage">Message</label>
                    <input id="customerMessage" type="text">
                </div>
            </div>

            <div id="customer-submit">
                <div class="form-group">
                    <button id="submitForm" type="submit">Submit</button>
                </div>
            </div>
        </form>
        </div>
    </div>
    </section>

    <script src="emailTest.js"></script>
